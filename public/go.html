<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<title>Opening…</title>
<style>
  :root { --ink:#14171C; --paper:#F3F1EC; --survey:#E8590C; --muted:#5B6470; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--ink); color:#fff; font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px max(16px, env(safe-area-inset-left)); }
  main { width:100%; max-width:420px; text-align:center; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { color:#c9cdd3; margin:0 0 18px; font-size:14px; }
  a.btn { display:block; background:var(--survey); color:#fff; text-decoration:none; font-weight:700; padding:16px; border-radius:12px; font-size:17px; }
  pre { text-align:left; white-space:pre-wrap; background:#1f242c; border-radius:10px; padding:12px; font-size:13px; color:#e6e8eb; max-height:40vh; overflow:auto; }
  button { margin-top:10px; background:transparent; color:#fff; border:1px solid #3a414c; border-radius:10px; padding:10px 14px; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1 id="h">Opening…</h1>
  <p id="p">If nothing happens, tap the button.</p>
  <a class="btn" id="go" href="#">Open</a>
  <pre id="body" hidden></pre>
  <button id="copy" type="button" hidden>Copy message</button>
</main>
<script>
// Internal relay for the Gundy team portal: turns #a=tel|sms|mail&n=…&to=…&s=…&b=… into a real phone, text or email link.
// Everything lives in the URL fragment, which never leaves this device.
(function () {
  var q = new URLSearchParams(location.hash.slice(1));
  var a = q.get('a'), n = (q.get('n') || '').replace(/[^\d+]/g, ''), b = q.get('b') || '', to = q.get('to') || '', s = q.get('s') || '';
  var apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  var url = '', label = '';
  if (a === 'tel' && n) { url = 'tel:' + n; label = 'Call ' + n; }
  else if (a === 'sms' && n) { url = 'sms:' + n + (b ? (apple ? '&body=' : '?body=') + encodeURIComponent(b) : ''); label = 'Text ' + n; }
  else if (a === 'mail' && to) { url = 'mailto:' + to + '?subject=' + encodeURIComponent(s) + '&body=' + encodeURIComponent(b); label = 'Email ' + to; }
  var go = document.getElementById('go');
  if (!url) { document.getElementById('h').textContent = 'Nothing to open'; document.getElementById('p').textContent = 'This link is missing its number or address.'; go.hidden = true; return; }
  document.getElementById('h').textContent = label;
  go.href = url; go.textContent = label;
  if (b) { var pre = document.getElementById('body'); pre.textContent = (s ? 'Subject: ' + s + '\n\n' : '') + b; pre.hidden = false;
    var c = document.getElementById('copy'); c.hidden = false;
    c.onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(b) : Promise.reject()).then(function () { c.textContent = 'Copied'; }, function () { var r = document.createRange(); r.selectNodeContents(pre); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }); };
  }
  setTimeout(function () { location.href = url; }, 150);
})();
</script>
</body>
</html>
