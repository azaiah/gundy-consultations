<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14171C" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Gundy Consultations | Leads, Bids and a Business OS for Contractors</title>
    <meta
      name="description"
      content="Gundy Consultations builds contractors a conversion-focused website plus a private portal that finds public bids and local leads every week, drafts the outreach, and runs the jobs."
    />
    <meta name="robots" content="index, follow" />

    <!-- Canonical + share preview (Open Graph / Twitter). Must stay on https://gundyconsultations.com or messaging apps show the wrong link and card. -->
    <link rel="canonical" href="https://gundyconsultations.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gundy Consultations" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Gundy Consultations | Your next contract is already posted. We find it." />
    <meta
      property="og:description"
      content="A website that wins trust plus a portal that finds public bids and local leads every week, drafts the outreach, and runs the jobs. Built for remodelers, roofers, GCs and specialty subs."
    />
    <meta property="og:url" content="https://gundyconsultations.com/" />
    <meta property="og:image" content="https://gundyconsultations.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://gundyconsultations.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gundy Consultations: Your next contract is already posted. We find it. Sample sweep card showing three scored bids and leads." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gundy Consultations | Your next contract is already posted. We find it." />
    <meta
      name="twitter:description"
      content="Leads, bids and a business operating system for contractors and construction companies."
    />
    <meta name="twitter:image" content="https://gundyconsultations.com/og-image.png" />
    <meta name="twitter:image:alt" content="Gundy Consultations preview card" />

    <!-- Hidden static form so Netlify Forms detects the consultation form at build time -->
    <form name="consultation" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="text" name="trade" />
      <input type="text" name="serviceArea" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="wantMoreOf" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
